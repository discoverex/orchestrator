name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --dev --frozen
      - name: Validate Prefect Caddyfile
        run: |
          docker run --rm \
            -e PREFECT_HOSTNAMES="prefect.example.com prefect-api.example.com" \
            -e PREFECT_PORT=4200 \
            -v "$PWD/infra/stacks/prefect-server/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
        env:
          PYTHONPATH: src
