name: CD

on:
  push:
    branches:
      - main
      - ops/test-action
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || format('{0}/orchestrator', github.repository_owner) }}

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --dev --frozen
      - run: uv run pytest -q
        env:
          PYTHONPATH: src

  build-images:
    needs: quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/prefect-server:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Build and (optionally) push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/prefect-server.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prefect-server:
    needs: build-images
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && vars.ENABLE_PREFECT_DEPLOY == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra/stacks/prefect-server/docker-compose.yml
            infra/stacks/prefect-server/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Prepare deploy compose
        run: cp infra/stacks/prefect-server/docker-compose.yml docker-compose.yml

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ vars.REMOTE_DEPLOY_PATH || '/opt/services/orchestrator-prefect' }}

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.REMOTE_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ vars.REMOTE_PORT || '22' }}" "${{ secrets.REMOTE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy prefect stack
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${{ vars.REMOTE_PORT || '22' }}" "${{ secrets.REMOTE_USERNAME }}@${{ secrets.REMOTE_HOST }}" \
            "set -euo pipefail; \
            export REMOTE_DEPLOY_PATH='${{ vars.REMOTE_DEPLOY_PATH || '/opt/services/orchestrator-prefect' }}'; \
            export PREFECT_SERVER_IMAGE='${{ needs.build-images.outputs.image }}'; \
            export PREFECT_PORT='${{ vars.PREFECT_PORT }}'; \
            export PREFECT_BIND_PORT='${{ vars.PREFECT_BIND_PORT }}'; \
            export PREFECT_BIND_ADDRESS='${{ vars.PREFECT_BIND_ADDRESS }}'; \
            export PREFECT_API_PUBLIC_URL='${{ vars.PREFECT_API_PUBLIC_URL }}'; \
            export PREFECT_DB_NAME='${{ vars.PREFECT_DB_NAME }}'; \
            export PREFECT_DB_USER='${{ vars.PREFECT_DB_USER }}'; \
            export PREFECT_DB_PASSWORD='${{ secrets.PREFECT_DB_PASSWORD }}'; \
            export PREFECT_DB_DATA_DIR='${{ vars.PREFECT_DB_DATA_DIR }}'; \
            export FLUSH_TARGET_URL='${{ vars.FLUSH_TARGET_URL }}'; \
            export FLUSH_GATEWAY_TOKEN='${{ secrets.FLUSH_GATEWAY_TOKEN }}'; \
            export FLUSH_CF_ACCESS_CLIENT_ID='${{ secrets.FLUSH_CF_ACCESS_CLIENT_ID }}'; \
            export FLUSH_CF_ACCESS_CLIENT_SECRET='${{ secrets.FLUSH_CF_ACCESS_CLIENT_SECRET }}'; \
            export PREFECT_MAINT_DATA_DIR='${{ vars.PREFECT_MAINT_DATA_DIR }}'; \
            export FLUSH_INTERVAL_SEC='${{ vars.FLUSH_INTERVAL_SEC }}'; \
            export PRUNE_INTERVAL_SEC='${{ vars.PRUNE_INTERVAL_SEC }}'; \
            export PRUNE_TTL_HOURS='${{ vars.PRUNE_TTL_HOURS }}'; \
            export FLUSH_PAGE_SIZE='${{ vars.FLUSH_PAGE_SIZE }}'; \
            export FLUSH_MAX_RUNS='${{ vars.FLUSH_MAX_RUNS }}'; \
            export PRUNE_PAGE_SIZE='${{ vars.PRUNE_PAGE_SIZE }}'; \
            export PRUNE_MAX_RUNS='${{ vars.PRUNE_MAX_RUNS }}'; \
            export GHCR_USERNAME='${{ github.actor }}'; \
            export GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'; \
            bash -s" < infra/stacks/prefect-server/deploy.sh
