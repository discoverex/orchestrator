[project]
name = "orchestrator"
version = "0.1.0"
description = "Prefect-based orchestration with runner and storage API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.12.0",
  "basicsr>=1.4.2",
  "diffusers>=0.35.2",
  "fastapi>=0.116.0",
  "hydra-core>=1.3.2",
  "kornia>=0.8.1",
  "minio>=7.2.18",
  "networkx>=3.6.1",
  "opencv-python-headless>=4.13.0.92",
  "pillow>=12.1.1",
  "prefect>=3.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.13.1",
  "protobuf>=6.33.5",
  "pyyaml>=6.0.3",
  "realesrgan>=0.3.0",
  "safetensors>=0.6.2",
  "scikit-image>=0.25.2",
  "sentencepiece>=0.2.1",
  "timm>=1.0.25",
  "torch>=2.10.0",
  "torchvision>=0.25.0",
  "transformers>=4.57.6",
  "typer>=0.24.1",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/common",
  "src/deployments",
  "src/flows",
  "src/runner",
  "src/storage",
  "src/worker_router",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", ".", "tests/fixtures/dummy_engine_repo/src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "src",
  "tests/fixtures/dummy_engine_repo/src",
  "infra/stacks/worker/colab",
]
explicit_package_bases = true
files = ["src", "scripts", "tests"]
