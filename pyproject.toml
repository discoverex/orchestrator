[project]
name = "orchestrator"
version = "0.1.0"
description = "Prefect-based orchestration with runner and storage gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "minio>=7.2.18",
  "prefect>=3.0.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
