version: 1

flow:
  name: e2e-job
  source: src/flows/worker_runtime/flow.py
  entrypoint: run_worker_job_flow
  parameters:
    run_mode: repo
    engine: dummy-engine
    repo_url: https://github.com/example/repo.git
    ref: main
    flow_entrypoint: src/dummy_engine/prefect_flow.py:dummy_engine_flow
    config: null
    job_name: null
    inputs: {}
    env: {}
    outputs_prefix: null

deployments:
  - name: e2e-test
    full_name: e2e-job/e2e-test
    work_pool: ${PREFECT_WORK_POOL:-gpu-pool}
    work_queue: gpu-fixed
    mode: primary
    role: fixed
  - name: e2e-test-colab
    full_name: e2e-job/e2e-test-colab
    work_pool: ${PREFECT_WORK_POOL:-gpu-pool}
    work_queue: gpu-colab
    mode: primary
    role: colab

notes:
  - This file is a declarative source of truth for canonical E2E deployment names.
  - Runtime env values such as Prefect API URL, auth headers, and registration source root remain env-driven.
  - register defaults read this file directly unless explicit CLI or env overrides are passed.
