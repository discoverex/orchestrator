services:
  base-runtime:
    build:
      context: ../../../..
      dockerfile: infra/images/base.Dockerfile
    image: orchestrator-base:local
    command: ["true"]

  worker:
    build:
      context: ../../../..
      dockerfile: infra/images/worker.Dockerfile
    image: orchestrator-worker:local
    container_name: ${WORKER_CONTAINER_NAME:-orchestrator-worker-fixed}
    restart: unless-stopped
    gpus: all
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-gpu-pool}
      PREFECT_WORK_QUEUE: ${PREFECT_WORK_QUEUE:-gpu-fixed}
      PREFECT_CLIENT_CUSTOM_HEADERS: ${PREFECT_CLIENT_CUSTOM_HEADERS:-}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      PREFECT_BROWSER_USER_AGENT: ${PREFECT_BROWSER_USER_AGENT:-}
      STORAGE_API_URL: ${STORAGE_API_URL:-}
      ORCHESTRATOR_CHECKPOINT_DIR: /var/lib/orchestrator/checkpoints
      ORCH_REPO_CACHE_DIR: /var/lib/orchestrator/repo_cache
    volumes:
      - ${WORKER_CHECKPOINT_DIR:-../../../../runtime/worker/checkpoints}:/var/lib/orchestrator/checkpoints
      - ${WORKER_REPO_CACHE_DIR:-../../../../runtime/worker/repo_cache}:/var/lib/orchestrator/repo_cache
