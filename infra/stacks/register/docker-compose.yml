services:
  base-runtime:
    build:
      context: ../../..
      dockerfile: infra/images/base.Dockerfile
    image: orchestrator-base:local
    command: ["true"]

  register:
    build:
      context: ../../..
      dockerfile: infra/images/register.Dockerfile
    image: orchestrator-register:local
    container_name: orchestrator-register
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-gpu-pool}
      PREFECT_WORK_QUEUE: ${PREFECT_WORK_QUEUE:-default}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      PREFECT_CLIENT_CUSTOM_HEADERS: ${PREFECT_CLIENT_CUSTOM_HEADERS:-}
      REGISTER_DEPLOYMENT_MODE: ${REGISTER_DEPLOYMENT_MODE:-dual}
      REGISTER_DEPLOYMENT_NAME: ${REGISTER_DEPLOYMENT_NAME:-e2e-test}
      REGISTER_FIXED_DEPLOYMENT_NAME: ${REGISTER_FIXED_DEPLOYMENT_NAME:-e2e-test}
      REGISTER_FIXED_DEPLOYMENT_QUEUE: ${REGISTER_FIXED_DEPLOYMENT_QUEUE:-gpu-fixed}
      REGISTER_COLAB_DEPLOYMENT_NAME: ${REGISTER_COLAB_DEPLOYMENT_NAME:-e2e-test-colab}
      REGISTER_COLAB_DEPLOYMENT_QUEUE: ${REGISTER_COLAB_DEPLOYMENT_QUEUE:-gpu-colab}
      REGISTER_COMPAT_FIXED_DEPLOYMENT_NAME: ${REGISTER_COMPAT_FIXED_DEPLOYMENT_NAME:-e2e-test-legacy}
      REGISTER_COMPAT_FIXED_DEPLOYMENT_QUEUE: ${REGISTER_COMPAT_FIXED_DEPLOYMENT_QUEUE:-gpu-fixed}
      REGISTER_COMPAT_COLAB_DEPLOYMENT_NAME: ${REGISTER_COMPAT_COLAB_DEPLOYMENT_NAME:-e2e-test-colab-legacy}
      REGISTER_COMPAT_COLAB_DEPLOYMENT_QUEUE: ${REGISTER_COMPAT_COLAB_DEPLOYMENT_QUEUE:-gpu-colab}
      REGISTER_COMPAT_ALIASES: ${REGISTER_COMPAT_ALIASES:-false}
      REGISTER_SPEC_FILE: ${REGISTER_SPEC_FILE:-/app/deployments/e2e/e2e-deployments.yaml}
      REGISTER_FLOW_SOURCE: ${REGISTER_FLOW_SOURCE:-/app}
      REGISTER_FLOW_ENTRYPOINT: ${REGISTER_FLOW_ENTRYPOINT:-}
      REGISTER_DEPLOYMENT_VERSION: ${REGISTER_DEPLOYMENT_VERSION:-}
