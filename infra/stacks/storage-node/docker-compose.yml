services:
  base-runtime:
    build:
      context: ../../..
      dockerfile: infra/images/base.Dockerfile
    image: orchestrator-base:local
    command: ["true"]

  minio:
    image: minio/minio:latest
    container_name: orchestrator-minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ${MINIO_DATA_DIR:-/srv/orchestrator/minio}:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-router:
    build:
      context: ../../..
      dockerfile: infra/images/worker-router.Dockerfile
    image: orchestrator-worker-router:local
    container_name: orchestrator-worker-router
    restart: unless-stopped
    environment:
      GATEWAY_REQUIRE_CF_ACCESS: ${GATEWAY_REQUIRE_CF_ACCESS:-true}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      STORAGE_API_HOST: ${STORAGE_API_HOST:-}
      STORAGE_HUMAN_HOST: ${STORAGE_HUMAN_HOST:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_AUTO_CREATE_BUCKET: ${MINIO_AUTO_CREATE_BUCKET:-true}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-orchestrator-artifacts}
      PRESIGN_TTL_DEFAULT: ${PRESIGN_TTL_DEFAULT:-900}
      PRESIGN_TTL_MAX: ${PRESIGN_TTL_MAX:-3600}
      MLFLOW_BACKEND_URL: http://mlflow:${MLFLOW_PORT:-5000}
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow-db:
    image: postgres:16
    container_name: orchestrator-mlflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-REPLACE_ME_DB_PASSWORD}
    volumes:
      - ${MLFLOW_DB_DATA_DIR:-/srv/orchestrator/mlflow-db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: ../../..
      dockerfile: infra/images/mlflow.Dockerfile
    image: orchestrator-mlflow:local
    container_name: orchestrator-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-REPLACE_ME_DB_PASSWORD}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      - --host
      - 0.0.0.0
      - --port
      - "${MLFLOW_PORT:-5000}"
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; p=os.environ.get('MLFLOW_PORT','5000'); urllib.request.urlopen(f'http://localhost:{p}/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0
    container_name: orchestrator-cloudflared
    restart: unless-stopped
    command:
      - tunnel
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./.cloudflared:/etc/cloudflared:ro
    depends_on:
      worker-router:
        condition: service_healthy
      mlflow:
        condition: service_healthy
